name: Build & Test

on:
  pull_request:
  push:
    branches: ["develop"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Verify generated API client types
        working-directory: frontend
        run: |
          npm run api:generate
          git diff --exit-code -- lib/api.generated.ts

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Run frontend story tests
        working-directory: frontend
        run: npm run test:stories

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser accessibility tests
        working-directory: frontend
        run: npm run test:e2e

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: visatrack_test
          POSTGRES_USER: visatrack
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visatrack -d visatrack_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://visatrack:test-only-password@localhost:5432/visatrack_test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        working-directory: backend
        run: |
          source venv/bin/activate
          pip-audit --disable-pip -r requirements.lock

      - name: Compile backend
        working-directory: backend
        run: |
          source venv/bin/activate
          python -m compileall app

      - name: Verify committed OpenAPI contract
        working-directory: backend
        run: |
          source venv/bin/activate
          python scripts/export_openapi.py
          git diff --exit-code -- ../docs/api/openapi.json

      - name: Bootstrap empty PostgreSQL database
        working-directory: backend
        run: |
          source venv/bin/activate
          alembic upgrade head
          alembic current --check-heads

      - name: Run backend tests
        working-directory: backend
        run: |
          source venv/bin/activate
          pytest tests -q

  containers:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build backend and worker image
        run: docker build --tag visatrack-backend:test backend

      - name: Build frontend image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
          --tag visatrack-frontend:test
          frontend
