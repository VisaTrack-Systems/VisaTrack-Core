---
---
name: Danger

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  danger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Danger
        uses: danger/danger-js@v11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
