version: "3.9"

services:
  db:
    image: postgres:16
    container_name: visatrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: visatrack
      POSTGRES_PASSWORD: visatrack
      POSTGRES_DB: visatrack
    ports:
      - "5432:5432"
    volumes:
      - visatrack_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visatrack-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://visatrack:visatrack@db:5432/visatrack
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visatrack-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"

volumes:
  visatrack_pg_data:

